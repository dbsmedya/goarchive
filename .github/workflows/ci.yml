name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      # The gate's non-database stages plus build, from the Makefile (one list; see
      # TestMakeCheckMatchesGate). The Go release comes from go.mod's toolchain line, which
      # Setup Go reads and the Makefile exports as GOTOOLCHAIN.
      - name: make check
        run: make check

      - name: Test version output
        run: |
          go build -ldflags "-X 'github.com/dbsmedya/goarchive/cmd/goarchive/cmd.Version=ci-test'" -o goarchive ./cmd/goarchive
          ./goarchive --version
          ./goarchive version
          go version ./goarchive
