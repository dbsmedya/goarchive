name: CI

on:
  push:
    branches: [main, dev/goarchive-3.1]
  pull_request:
    branches: [main, dev/goarchive-3.1]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      # The gate's non-database stages plus build, from the Makefile (one list; see
      # TestMakeCheckMatchesGate). The Go release comes from go.mod's toolchain line, which
      # Setup Go reads and the Makefile exports as GOTOOLCHAIN.
      - name: make check
        run: make check

      - name: Test version output
        run: |
          go build -ldflags "-X 'github.com/dbsmedya/goarchive/v3/cmd/goarchive/cmd.Version=ci-test'" -o goarchive ./cmd/goarchive
          ./goarchive --version
          ./goarchive version
          go version ./goarchive

  logger-windows:
    name: Logger on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # A release ships a Windows binary, where a log file's mode sets only the read-only
      # attribute (GH #5: log files are created owner-only). The logger's tests run there too.
      # So do the control socket's platform tests (TEL-1): the lock, the stale-socket and
      # identity checks, the path limit, and the probes of how Windows answers a connect and a
      # close, which pin what the first Windows run measured; -v puts what the probes saw in the
      # log. The client's tests (TEL-1 C7) run in the step after this one.
      - name: Logger and control tests
        run: go test ./internal/logger/ ./internal/control/... ./internal/controlpath/ -count=1 -v

      # The control client's exchange and exit codes against a real server and test listeners, and
      # the command's own TestControl tests. A separate step: a PowerShell step's exit code is its
      # last command's, so a second go test in the step above could hide a failure of the first.
      - name: Control client tests
        run: go test ./cmd/goarchive/cmd/ -run TestControl -count=1 -v
