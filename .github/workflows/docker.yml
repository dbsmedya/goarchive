name: Docker

on:
  push:
    branches: [main, master, v3]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master, v3]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need full history + tags so `git describe` can produce a
          # meaningful VERSION for branch builds.
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          # On tag pushes, use the tag (stripped of the leading 'v') so the
          # in-image binary version exactly matches the Docker image tag
          # produced by metadata-action. On branch pushes, use the Makefile's
          # RELEASE_VERSION with the commit, e.g. <RELEASE_VERSION>-dev.b191450:
          # `git describe` would name the newest reachable tag, which on the
          # 3.0 line is a 2.x release.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            RELEASE="$(sed -n 's/^RELEASE_VERSION *:= *//p' Makefile)"
            VERSION="${RELEASE:?RELEASE_VERSION not found in Makefile}-dev.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is set explicitly, never by metadata-action's latest=auto: it
          # names a stable 3.x release only (the tag pushed last), so no branch build, no
          # prerelease (a tag with a "-", such as an alpha) and no 2.x tag can take it.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v3.') && !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Propagate version into the Dockerfile's ARG VERSION / ARG COMMIT so
          # the in-image binary reports the same version as the image tag.
          # Without this, ARG VERSION=dev in the Dockerfile wins and the
          # binary inside would always report "dev".
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.version.outputs.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
