# Gate verify (beta.2 PR 6, RVG-1a+b, spec .ayder/superpowers_20261015/specs/
# 2026-10-16-beta2-verify-split-design.md; the image gates of the beta.1 release-verify
# workflow): make gate on an estate built from each supported image, on one commit. Started by
# a pull request into main (the dev/goarchive-3.1 → main PR; the PR's head SHA, re-run on each
# push, the earlier run cancelled), or, for an ad-hoc run, by a push of a verify-gate/<sha7>
# branch or a dispatch with a SHA (tests/README.md → "The full matrix runs on GitHub"). Never
# on merges.
# Since beta.3 (RVG-3, spec .ayder/superpowers_20261017/specs/2026-10-17-beta3-gate-verify-split-design.md)
# each image runs as two jobs that start together, the gate's integration part and its e2e part
# (run-gate.sh --part), and the summary wants both parts of every image certified.
# Since GRG-1 (spec .ayder/superpowers_20261115/specs/2026-11-15-group-replication-support-design.md §9)
# the gate also runs on the group estate (TOPOLOGY=group: tests/README.md → The group estate), one
# image per series, as the same two parts: the integration-group and e2e-group jobs, and the summary
# wants their three images' two parts too.
name: Gate verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['verify-gate/**']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA to verify'
        required: true
        type: string

permissions:
  contents: read

# A pull request is one group by its number, so a new push cancels the old run; a dispatch or a
# push is one group by its SHA.
concurrency:
  group: gate-verify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  # MySQL Shell's dump refuses a server newer than itself, so it matches the newest gate image;
  # the same package as matrix-verify.yml's.
  MYSQLSH_DEB: mysql-shell_9.7.1-1ubuntu24.04_amd64.deb

jobs:
  target:
    name: Target commit
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          # On a pull request github.sha is the merge commit, never the commit to verify.
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          sha="${INPUT_SHA:-${PR_SHA:-$PUSH_SHA}}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a full commit SHA: $sha"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration on ${{ matrix.image }}
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # Exact releases, so a run is reproducible and MySQL Shell supports each one; move them
        # forward deliberately, with MYSQLSH_DEB. The matrix's version rows keep floating tags.
        image:
          - mysql:8.0.40
          - mysql:8.4.11
          - mysql:9.7.1
          - percona/percona-server:8.0.46-37
          - percona/percona-server:8.4.11-11
          - percona/percona-server:9.7.1-1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install MySQL Shell
        run: |
          curl -fsSLo "/tmp/$MYSQLSH_DEB" "https://dev.mysql.com/get/Downloads/MySQL-Shell/$MYSQLSH_DEB"
          sudo apt-get install -y "/tmp/$MYSQLSH_DEB"
          mysqlsh --version
      - name: Gate, part integration
        env:
          GA_ESTATE_IMAGE: ${{ matrix.image }}
        run: |
          cp tests/dot.env tests/.env
          set -a; . tests/.env; set +a
          make e2e-setup
          bash tests/scripts/run-gate.sh --part integration
      - name: Server version
        if: always()
        run: |
          . tests/scripts/topology.sh
          docker exec "$ESTATE_SOURCE" mysql -uroot -p"$(grep ^MYSQL_ROOT_PASSWORD= "tests/$ESTATE_ENV" | cut -d= -f2)" -N -e 'SELECT @@version' > tests/results/gate/server-version.txt 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-integration-${{ strategy.job-index }}
          path: tests/results/gate/
          if-no-files-found: warn

  e2e:
    name: E2E on ${{ matrix.image }}
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # Exact releases, so a run is reproducible and MySQL Shell supports each one; move them
        # forward deliberately, with MYSQLSH_DEB. The matrix's version rows keep floating tags.
        image:
          - mysql:8.0.40
          - mysql:8.4.11
          - mysql:9.7.1
          - percona/percona-server:8.0.46-37
          - percona/percona-server:8.4.11-11
          - percona/percona-server:9.7.1-1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install MySQL Shell
        run: |
          curl -fsSLo "/tmp/$MYSQLSH_DEB" "https://dev.mysql.com/get/Downloads/MySQL-Shell/$MYSQLSH_DEB"
          sudo apt-get install -y "/tmp/$MYSQLSH_DEB"
          mysqlsh --version
      # E2E 20 sends the control socket's documented lines with nc -U and socat, as a script without
      # the binary would, and fails (not skips) when a tool is missing.
      - name: Install the control socket test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq netcat-openbsd socat
      - name: Gate, part e2e
        env:
          GA_ESTATE_IMAGE: ${{ matrix.image }}
        run: |
          cp tests/dot.env tests/.env
          set -a; . tests/.env; set +a
          make e2e-setup
          bash tests/scripts/run-gate.sh --part e2e
      - name: Server version
        if: always()
        run: |
          . tests/scripts/topology.sh
          docker exec "$ESTATE_SOURCE" mysql -uroot -p"$(grep ^MYSQL_ROOT_PASSWORD= "tests/$ESTATE_ENV" | cut -d= -f2)" -N -e 'SELECT @@version' > tests/results/gate/server-version.txt 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-e2e-${{ strategy.job-index }}
          path: tests/results/gate/
          if-no-files-found: warn

  integration-group:
    name: Integration on the group estate, ${{ matrix.image }}
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TOPOLOGY: group
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # One image per series, the plain jobs' own pinned releases (GRG-1): the group estate's five
        # servers per image, with the library's evidence covering both vendors for the facts.
        image:
          - mysql:8.0.40
          - mysql:8.4.11
          - mysql:9.7.1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install MySQL Shell
        run: |
          curl -fsSLo "/tmp/$MYSQLSH_DEB" "https://dev.mysql.com/get/Downloads/MySQL-Shell/$MYSQLSH_DEB"
          sudo apt-get install -y "/tmp/$MYSQLSH_DEB"
          mysqlsh --version
      - name: Gate, part integration
        env:
          GA_ESTATE_IMAGE: ${{ matrix.image }}
        run: |
          cp tests/dot.env.group tests/.env.group
          set -a; . tests/.env.group; set +a
          make e2e-setup
          bash tests/scripts/run-gate.sh --part integration
      - name: Server version
        if: always()
        run: |
          . tests/scripts/topology.sh
          docker exec "$ESTATE_SOURCE" mysql -uroot -p"$(grep ^MYSQL_ROOT_PASSWORD= "tests/$ESTATE_ENV" | cut -d= -f2)" -N -e 'SELECT @@version' > tests/results/gate/server-version.txt 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-group-integration-${{ strategy.job-index }}
          path: tests/results/gate/
          if-no-files-found: warn

  e2e-group:
    name: E2E on the group estate, ${{ matrix.image }}
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TOPOLOGY: group
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # One image per series, the plain jobs' own pinned releases (GRG-1): the group estate's five
        # servers per image, with the library's evidence covering both vendors for the facts.
        image:
          - mysql:8.0.40
          - mysql:8.4.11
          - mysql:9.7.1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install MySQL Shell
        run: |
          curl -fsSLo "/tmp/$MYSQLSH_DEB" "https://dev.mysql.com/get/Downloads/MySQL-Shell/$MYSQLSH_DEB"
          sudo apt-get install -y "/tmp/$MYSQLSH_DEB"
          mysqlsh --version
      # E2E 20 sends the control socket's documented lines with nc -U and socat, as a script without
      # the binary would, and fails (not skips) when a tool is missing.
      - name: Install the control socket test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq netcat-openbsd socat
      - name: Gate, part e2e
        env:
          GA_ESTATE_IMAGE: ${{ matrix.image }}
        run: |
          cp tests/dot.env.group tests/.env.group
          set -a; . tests/.env.group; set +a
          make e2e-setup
          bash tests/scripts/run-gate.sh --part e2e
      - name: Server version
        if: always()
        run: |
          . tests/scripts/topology.sh
          docker exec "$ESTATE_SOURCE" mysql -uroot -p"$(grep ^MYSQL_ROOT_PASSWORD= "tests/$ESTATE_ENV" | cut -d= -f2)" -N -e 'SELECT @@version' > tests/results/gate/server-version.txt 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-group-e2e-${{ strategy.job-index }}
          path: tests/results/gate/
          if-no-files-found: warn

  summary:
    name: Summary
    needs: [target, integration, e2e, integration-group, e2e-group]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/download-artifact@v5
        with:
          path: evidence
      - name: Summarize
        # Artifacts alone cannot show that a job finished: each dependency's result goes to the
        # summary too, and anything but success fails the run. The run wants six gates (each
        # image's two parts), three group gates (the group estate's, one image per series) and no row.
        env:
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          TARGET_RESULT: ${{ needs.target.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          INTEGRATION_GROUP_RESULT: ${{ needs.integration-group.result }}
          E2E_GROUP_RESULT: ${{ needs.e2e-group.result }}
        run: |
          set -o pipefail
          bash tests/envmatrix/gh-summary.sh evidence "$TARGET_SHA" 0 6 3 \
            "target=$TARGET_RESULT" "integration=$INTEGRATION_RESULT" "e2e=$E2E_RESULT" \
            "integration-group=$INTEGRATION_GROUP_RESULT" "e2e-group=$E2E_GROUP_RESULT" | tee gate-verify.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          # Not gate-*: a re-run summary downloads it, and gh-summary.sh counts gate-*/ as gates.
          name: summary-gate
          path: gate-verify.md
