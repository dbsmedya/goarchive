# Matrix verify (beta.2 PR 6, RVG-1a+b, spec .ayder/superpowers_20261015/specs/
# 2026-10-16-beta2-verify-split-design.md; the beta.1 release-verify workflow less its image
# gates): every rows.tsv row of the environment matrix on one commit. Started by a push of a
# verify/<sha7> branch (or, once this file is on the default branch, a dispatch with a SHA), on
# the final SHA of a PR whose change needs it (tests/README.md → "Which checks a change needs"). Never on PRs or
# merges. The gate on every supported image is gate-verify.yml (verify-gate/<sha7>).
name: Matrix verify

on:
  push:
    branches: ['verify/**']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: matrix-verify-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  # run-matrix.sh waits for each server through tests/scripts/mysql-query.sh, which uses MySQL
  # Shell; the same package as gate-verify.yml's.
  MYSQLSH_DEB: mysql-shell_9.7.1-1ubuntu24.04_amd64.deb

jobs:
  target:
    name: Target commit
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          sha="${INPUT_SHA:-$PUSH_SHA}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a full commit SHA: $sha"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - id: rows
        run: |
          rows=$(grep -v '^#' tests/envmatrix/rows.tsv | grep -v '^[[:space:]]*$' | cut -f1 | jq -R . | jq -cs .)
          echo "rows=$rows" >> "$GITHUB_OUTPUT"

  matrix:
    name: Matrix row ${{ matrix.row }}
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # max-parallel limits one matrix, not the run: 14 rows leave six of the account's 20 jobs,
      # the six gates of a Gate verify run on a release PR, or ordinary CI.
      max-parallel: 14
      matrix:
        row: ${{ fromJSON(needs.target.outputs.rows) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install MySQL Shell
        run: |
          curl -fsSLo "/tmp/$MYSQLSH_DEB" "https://dev.mysql.com/get/Downloads/MySQL-Shell/$MYSQLSH_DEB"
          sudo apt-get install -y "/tmp/$MYSQLSH_DEB"
          mysqlsh --version
      - name: Row
        env:
          ROW: ${{ matrix.row }}
          MX_PAIRS: '1'
          MX_TIMEOUT: 6m
          MX_TAG: gh
          MX_SKIP_FILE: tests/envmatrix/gh-skip.txt
        run: |
          cp tests/dot.env tests/.env
          tests/envmatrix/run-matrix.sh "$ROW"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ matrix.row }}
          path: tests/results/envmatrix/gh/
          include-hidden-files: true  # .work holds the pair and group start-up logs
          if-no-files-found: warn

  summary:
    name: Summary
    needs: [target, matrix]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/download-artifact@v5
        with:
          path: evidence
      - name: Summarize
        # Artifacts alone cannot show that a job finished: each dependency's result goes to the
        # summary too, and anything but success fails the run. The run wants every row and no
        # gate.
        env:
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          ROWS: ${{ needs.target.outputs.rows }}
          TARGET_RESULT: ${{ needs.target.result }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
        run: |
          set -o pipefail
          bash tests/envmatrix/gh-summary.sh evidence "$TARGET_SHA" "$(jq length <<<"${ROWS:-[]}")" 0 \
            "target=$TARGET_RESULT" "matrix=$MATRIX_RESULT" | tee matrix-verify.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          # Not matrix-*: a re-run summary downloads it, and gh-summary.sh counts matrix-*/ rows.
          name: summary-matrix
          path: matrix-verify.md
